# ~/.config/tmux/tmux.conf

# --- prefix -------------------------------------------------------------
# Ctrl-A instead of Ctrl-B. Press it twice to send a literal Ctrl-A
# through to the shell (readline beginning-of-line, nested tmux).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- general ------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # don't swallow Esc; keeps vim responsive
set -g focus-events on
set -g set-clipboard on         # OSC 52 copy to the system clipboard

# Windows and panes count from 1; close a gap by renumbering.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- colour -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- key bindings -------------------------------------------------------
# Split keeping the current directory; | and - look like what they do.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing (-r = repeatable without prefix).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- copy mode ----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- status bar ---------------------------------------------------------
set -g status-position bottom
set -g status-style "fg=colour245,bg=colour236"
set -g status-left "#[fg=colour236,bg=colour109,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour245] #h  %Y-%m-%d %H:%M "
set -g window-status-current-style "fg=colour236,bg=colour245,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=colour109"
set -g pane-border-style "fg=colour238"
