# ~/.config/tmux/tmux.conf
#
# Descended from the 2013 config in mikepea/dotfiles, which came from
# http://blog.hawkhost.com/2010/06/28/tmux-the-terminal-multiplexer/
# via https://github.com/matthewfranglen/dotfiles/
# Screen-era bindings kept deliberately; the rest modernised for tmux 3.x.

# --- prefix: make it behave like screen ---------------------------------
# Ctrl-B is a contortion for something used this often.
set -g prefix C-a
bind a send-prefix        # C-a a  -> literal Ctrl-A (readline start-of-line)
bind C-a last-window      # C-a C-a -> last window, as in screen

# --- general ------------------------------------------------------------
set -g history-limit 50000
set -sg escape-time 10          # don't swallow Esc; keeps vim responsive
set -g focus-events on
set -g set-clipboard on         # OSC 52: replaces the old xsel binding,
                                # and works over SSH and on a bare tty
setw -g automatic-rename on
set -g visual-activity on
set -g renumber-windows on      # windows still start at 0, just no gaps

# --- colour -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- splitting ----------------------------------------------------------
# | splits side by side, - splits top and bottom. New panes and windows
# inherit the current directory (this is the modern bit).
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- panes and windows --------------------------------------------------
# vim motion keys to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# swapping panes and windows (-r = repeatable without re-pressing prefix)
bind -r   J swap-pane -D
bind -r   K swap-pane -U
bind -r C-j swap-window -t -
bind -r C-k swap-window -t +

# resize on the arrow keys, since J/K are taken by swap-pane
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# more screen compat
unbind " "
bind " " next-window
unbind A
bind A command-prompt "rename-window %%"

# overrides the default refresh-client binding
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- copy mode ----------------------------------------------------------
# What the commented-out block in the old config was reaching for, in the
# syntax tmux has used since 2.4 (the old -t vi-copy form was removed).
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- status bar ---------------------------------------------------------
set -g status on
set -g status-interval 2
set -g status-style "fg=colour231,bg=colour234"   # status-utf8 is gone in 3.x
set -g status-left-length 20
set -g status-right-length 150
set -g status-left "#[fg=colour234,bg=colour109,bold] #S #[default] "
set -g status-right "#[fg=colour245] #h  %Y-%m-%d %H:%M "
set -g window-status-current-style "fg=colour234,bg=colour231,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g pane-active-border-style "fg=colour109"
set -g pane-border-style "fg=colour238"

# --- plugins ------------------------------------------------------------
# tpm lives under XDG rather than ~/.tmux; chezmoi's run_once_install-tpm.sh
# clones it on a new machine. prefix I installs, prefix U updates.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Manual save/restore only, no continuum autosave:
#   prefix Ctrl-s  save     prefix Ctrl-r  restore
run '~/.config/tmux/plugins/tpm/tpm'
